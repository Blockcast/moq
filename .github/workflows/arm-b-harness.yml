name: Arm-B harness

# BLO-41723 condition 1: the arm-B MMTP->MoQ harness is the evidence for the
# arm B ruling, so it has to be *run*, not merely committed. Before this lane
# it was committed and run by nothing:
#
#   * `rs/moq-relay/tests/mmtp_arm_b.rs` opens `#![cfg(feature =
#     "test-support")]`, and `test-support` is not in moq-relay's `default`.
#   * The PR lane (`Check` -> `just ci test` -> `rs/justfile` `check-test`)
#     runs `cargo nextest run --locked --all-targets --no-tests=pass` with no
#     `--all-features`, so the file compiles to an *empty* test binary and
#     `--no-tests=pass` makes that silently green.
#   * The only recipe that enables it is `just rs features` (`--all-features`),
#     wired solely to `nightly.yml`'s cron -- and GitHub does not run scheduled
#     workflows on a fork, so Nightly has never run here (0 runs, workflow
#     `active`).
#
# So this lane runs the harness directly, and `--no-tests=fail` is the point:
# if the feature ever stops pulling the file in, or the file moves, this goes
# red instead of passing on nothing. That silent-skip is the defect above.
#
# `RUSTUP_TOOLCHAIN=stable` is deliberately NOT set here. It is the workaround
# for a disposable clone where `rust-toolchain.toml`'s 1.98.1 pin is not
# installed and the rustup home is read-only; in CI the Nix dev shell supplies
# the pinned toolchain, and forcing `stable` would override it.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Nightly never fires on a fork, so `main` needs its own standing guard: this
  # harness backs a claim *about* `main`.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: arm-b-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Arm-B harness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Same cachix trust as check.yml: `nixConfig` in flake.nix is
          # untrusted by default, and without this the dev shell rebuilds from
          # source anything missing from the public nixpkgs cache.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # The command the harness's own module docs tell a reader to run, so the
      # doc and the gate cannot drift. One crate, one test target -- not the
      # whole-workspace `--all-features` build that `just rs features` pays for.
      - name: Run the arm-B harness
        run: |
          nix develop --command cargo nextest run --locked \
            -p moq-relay --features test-support \
            --test mmtp_arm_b --no-tests=fail
        env:
          NEXTEST_PROFILE: ci
